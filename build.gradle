plugins {
    id 'java'
}

group = 'com.qalight.demoshop'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Playwright - for browser automation
    implementation 'com.microsoft.playwright:playwright:1.47.0'

    // TestNG - for structuring tests
    testImplementation 'org.testng:testng:7.10.2'

    // Logback - SLF4J implementation for structured logging
    implementation 'ch.qos.logback:logback-classic:1.5.6'
}

test {
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
    failOnNoDiscoveredTests = false
}

tasks.register('installPlaywrightBrowsers', JavaExec) {
    group = 'verification'
    description = 'Downloads Playwright browsers on first run'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install']
}